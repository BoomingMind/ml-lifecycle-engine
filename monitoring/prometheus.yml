# Prometheus scrape configuration.
#
# Prometheus pulls metrics from targets on an interval.
# Our FastAPI service exposes Prometheus-format metrics at GET /metrics.
#
# Start with docker-compose, then open:
# - Prometheus UI: http://localhost:9090
# - Query example: http_requests_total

global:
  # How often Prometheus should ask each target for fresh metrics.
  scrape_interval: 15s

scrape_configs:
  - job_name: "api"
    # Our FastAPI app exposes Prometheus-format metrics at /metrics.
    metrics_path: "/metrics"
    static_configs:
      # Inside docker-compose network, the API container is reachable by service name "api".
      - targets: ["api:8000"]
