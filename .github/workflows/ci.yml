name: CI

on:
  # Run the checks when code is pushed to the repository...
  push:
  # ...and also when someone opens or updates a pull request.
  pull_request:

jobs:
  test:
    # GitHub provides a fresh Linux machine for this job.
    runs-on: ubuntu-latest
    steps:
      # Step 1: download the repository contents into the runner.
      - uses: actions/checkout@v4
      # Step 2: install the Python version we want the project to use.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Reuse downloaded Python packages between runs to speed things up.
          cache: "pip"
      # Step 3: install application, MLOps, and developer/testing dependencies.
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-mlops.txt -r requirements-dev.txt
      # Step 4: run the linter to catch style and import issues early.
      - name: Lint
        run: |
          ruff check .
      # Step 5: run automated tests.
      - name: Tests
        env:
          # CI does not load the heavy model file; tests use the lightweight dummy mode.
          DISABLE_MODEL_LOAD: "1"
          # Make local package imports like `from defect_detection...` work in CI.
          PYTHONPATH: "src"
        run: |
          pytest
