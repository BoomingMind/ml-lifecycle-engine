name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-mlops.txt -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
      - name: Tests
        env:
          DISABLE_MODEL_LOAD: "1"
          PYTHONPATH: "src"
        run: |
          pytest
