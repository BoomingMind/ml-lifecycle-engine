stages:
  download_mvtec_ad:
    cmd: python3 scripts/download_mvtec_ad.py --out data/raw/mvtec_ad
    deps:
      - scripts/download_mvtec_ad.py
    outs:
      - data/raw/mvtec_ad
  validate:
    cmd: PYTHONPATH=src python3 scripts/validate_data.py --manifest data/manifest.csv
    deps:
      - scripts/validate_data.py
      - data/manifest.csv
    outs:
      - reports/validation.ok
    always_changed: true
  train:
    cmd: PYTHONPATH=src python3 scripts/train.py --params params.yaml
    deps:
      - scripts/train.py
      - src/defect_detection/mlflow_models.py
      - params.yaml
      - data/dataset.yaml
    outs:
      - runs
    params:
      - train
