# Minimal reverse proxy in front of the FastAPI service.
#
# Why Nginx exists in this stack:
# - In production you typically put a proxy/load balancer in front of the app
# - It can terminate TLS, do routing, buffering, timeouts, and rate limiting

events {}

http {
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss;

  server {
    listen 80;

    location / {
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;

      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;

      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
    }
  }
}
