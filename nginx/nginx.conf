# Minimal reverse proxy in front of the FastAPI service.
#
# Why Nginx exists in this stack:
# - In production you typically put a proxy/load balancer in front of the app
# - It can terminate TLS, do routing, buffering, timeouts, and rate limiting

events {}

http {
  # Compress text responses to reduce bandwidth and improve page load speed.
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss;

  server {
    # Nginx listens on port 80 *inside the container*.
    listen 80;

    location / {
      # Forward all incoming requests to the FastAPI container.
      proxy_pass http://api:8000;
      # Preserve original host and client connection information.
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Generate/forward a request id so backend logs can be correlated.
      proxy_set_header X-Request-ID $request_id;

      # Use HTTP/1.1 and reasonable timeouts for upstream communication.
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;

      # Security headers returned to browsers.
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
    }
  }
}
